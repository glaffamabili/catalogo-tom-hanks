<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Tom Hanks</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .hidden { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .movie-card { border: 1px solid #ddd; padding: 10px; border-radius: 6px; text-align: center; }
    input, button, textarea { width: 100%; margin-top: 8px; padding: 10px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div id="auth-section" class="card">
      <h2>Autenticação</h2>
      <input type="text" id="nome" placeholder="Seu Nome (Cadastro)">
      <input type="email" id="email" placeholder="Seu E-mail">
      <input type="password" id="senha" placeholder="Sua Senha">
      <button onclick="login()">Entrar</button>
      <button onclick="cadastrar()" style="background: #28a745;">Cadastrar</button>
      <hr>
      <button onclick="esqueciSenha()" style="background: #ffc107; color: #000;">Esqueci Minha Senha</button>
      <p id="auth-msg" style="color: red;"></p>
    </div>

    <div id="app-section" class="card hidden">
      <div style="display: flex; justify-content: space-between;">
        <h2>Olá, <span id="user-display"></span> (<span id="role-display"></span>)!</h2>
        <button onclick="logout()" style="width: auto; background: #dc3545;">Sair</button>
      </div>
      <hr>
      <h3>Filmes de Tom Hanks</h3>
      <div id="movies-list" class="grid">Carregando...</div>
      <hr>
      <h3>Meus Favoritos</h3>
      <div id="favs-list" class="grid"></div>
      <hr>
      <h3>Meus Comentários</h3>
      <div id="comments-list"></div>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });
      const data = await res.json();
      if (res.ok) { carregarDados(); } 
      else { document.getElementById('auth-msg').innerText = data.error; }
    }

    async function cadastrar() {
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, email, senha })
      });
      const data = await res.json();
      if (res.ok) { carregarDados(); } 
      else { document.getElementById('auth-msg').innerText = data.error; }
    }

    async function esqueciSenha() {
      const email = document.getElementById('email').value;
      if (!email) return alert('Digite o e-mail no campo acima.');
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      location.reload();
    }

    async function carregarDados() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');

      const meRes = await fetch('/api/me');
      const me = await meRes.json();
      document.getElementById('user-display').innerText = me.nome;
      document.getElementById('role-display').innerText = me.role;

      const mRes = await fetch('/api/movies');
      const movies = await mRes.json();
      document.getElementById('movies-list').innerHTML = movies.map(m => `
        <div class="movie-card">
          <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : 'https://via.placeholder.com/150'}" style="width:100%;" />
          <h4>${m.title}</h4>
          <button onclick="favoritar(${m.id}, '${m.title.replace(/'/g, "\\'")}', '${m.poster_path}')">★ Favoritar</button>
          <textarea id="comm-${m.id}" placeholder="Comentário..."></textarea>
          <button onclick="comentar(${m.id})" style="background:#17a2b8;">Comentar</button>
        </div>
      `).join('');

      carregarFavoritos();
      carregarComentarios();
    }

    async function favoritar(tmdb_movie_id, titulo, poster_path) {
      await fetch('/api/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tmdb_movie_id, titulo, poster_path })
      });
      carregarFavoritos();
    }

    async function carregarFavoritos() {
      const res = await fetch('/api/favorites');
      const favs = await res.json();
      document.getElementById('favs-list').innerHTML = favs.map(f => `
        <div class="movie-card">
          <img src="https://image.tmdb.org/t/p/w500${f.poster_path}" style="width:100%;" />
          <h4>${f.titulo}</h4>
        </div>
      `).join('');
    }

    async function comentar(tmdb_movie_id) {
      const texto = document.getElementById(`comm-${tmdb_movie_id}`).value;
      if (!texto) return;
      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tmdb_movie_id, texto })
      });
      document.getElementById(`comm-${tmdb_movie_id}`).value = '';
      carregarComentarios();
    }

    async function carregarComentarios() {
      const res = await fetch('/api/comments');
      const comms = await res.json();
      document.getElementById('comments-list').innerHTML = comms.map(c => `
        <div style="border-bottom: 1px solid #ccc; padding: 5px 0;">
          <p><strong>Filme ID ${c.tmdb_movie_id}:</strong> ${c.texto}</p>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
