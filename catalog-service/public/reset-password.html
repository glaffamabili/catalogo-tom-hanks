<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha | Catálogo Tom Hanks</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d30;
      --bg-input: #0f172a;
      --border-color: #263352;
      --accent: #e50914;
      --accent-hover: #f40612;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      --transition: all 0.25s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 70%);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--accent), #b91c1c);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }

    h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      font-size: 15px;
    }

    .form-control {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent-green);
      color: white;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-top: 20px;
      transition: var(--transition);
    }

    .btn-back:hover {
      color: #fff;
    }

    .msg-feedback {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-icon">
      <i class="fa-solid fa-lock-open"></i>
    </div>
    <h2>Criar Nova Senha</h2>
    <p class="subtitle">Defina uma nova senha forte para acessar sua conta no Catálogo Tom Hanks.</p>

    <form onsubmit="event.preventDefault(); redefinir();">
      <div class="form-group">
        <label>Nova Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="novaSenha" class="form-control" placeholder="••••••••" required minlength="4">
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn">
        <i class="fa-solid fa-check"></i> Atualizar Minha Senha
      </button>
    </form>

    <div id="msg" class="msg-feedback"></div>

    <a href="/" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Voltar para o login
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function redefinir() {
      const novaSenha = document.getElementById('novaSenha').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn-submit');

      if (!token) {
        msg.style.color = '#f87171';
        msg.innerText = 'Token ausente ou link inválido.';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Atualizando...';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha })
        });
        const data = await res.json();
        
        if (res.ok) {
          msg.style.color = '#34d399';
          msg.innerText = 'Senha alterada com sucesso! Redirecionando...';
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          msg.style.color = '#f87171';
          msg.innerText = data.error || 'Erro ao redefinir a senha.';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Atualizar Minha Senha';
        }
      } catch (err) {
        msg.style.color = '#f87171';
        msg.innerText = 'Erro ao se comunicar com o servidor.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Atualizar Minha Senha';
      }
    }
  </script>
</body>
</html>
