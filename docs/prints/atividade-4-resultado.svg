    <text x="320" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">glaffamabili@gmail.com</text>
    <rect x="540" y="106" width="70" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
