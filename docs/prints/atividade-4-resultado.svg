    <text x="700" y="120" fill="#64748b" font-family="sans-serif" font-size="11">Sua Conta</text>

    <!-- Linha 2 Usuario -->
    <rect x="60" y="138" width="780" height="38" fill="#0a0e17"/>
    <text x="80" y="162" fill="#ffffff" font-family="monospace" font-size="12">#2</text>
