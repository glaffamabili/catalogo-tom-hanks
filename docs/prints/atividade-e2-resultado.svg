    <text x="120" y="25" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12">https://github.com/glaffamabili/catalogo-tom-hanks/actions</text>
    
    <!-- Header do App -->
