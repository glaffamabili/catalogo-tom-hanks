    <text x="210" y="73" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13">• Pipeline Automatizado de Testes e Build Multi-stage</text>
    
    <rect x="740" y="55" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
