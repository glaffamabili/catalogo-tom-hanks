<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
    <!-- Moldura de Janela Web Moderna -->
    <rect width="900" height="480" rx="10" fill="#0b0f19" stroke="#263352" stroke-width="2"/>
    
    <!-- Topbar do Navegador -->
