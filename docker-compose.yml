version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  # Servidor Redis para persistência de logs em Redis Streams (XADD)
  redis:
    image: redis:7-alpine
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Microsserviço de Logs e Auditoria (Atividade 5)
  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health?format=json', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  # Microsserviço de Autenticação (Atividade 3 / 4)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      - DB_HOST=35.226.64.52
      - DB_USER=IAC_2026_02_amabili_flor
      - DB_PASSWORD=OLv1YqcvRAjZws
      - DB_NAME=IAC_2026_02_amabili_flor
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - APP_URL=${APP_URL}
      - LOG_SERVICE_URL=http://log-service:3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health?format=json', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Microsserviço Catálogo e Frontend (Atividade 2 / 4 / 5)
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    ports:
      - "8200:3000"
    networks:
      - app-network
    environment:
      - DB_HOST=35.226.64.52
      - DB_USER=IAC_2026_02_amabili_flor
      - DB_PASSWORD=OLv1YqcvRAjZws
      - DB_NAME=IAC_2026_02_amabili_flor
      - TMDB_API_KEY=${TMDB_API_KEY}
      - AUTH_SERVICE_URL=http://auth-service:3000
      - LOG_SERVICE_URL=http://log-service:3000
      - APP_URL=${APP_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health?format=json', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy