version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  # Servidor Redis para persistência de logs em Redis Streams (Atividade 5)
  redis:
    image: redis:7-alpine
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Object Storage MinIO para fotos de perfil dos usuários (Atividade 6)
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    networks:
      - app-network
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Microsserviço de Logs e Auditoria (Atividade 5)
  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health?format=json', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  # Microsserviço de Autenticação (Atividade 3 / 4)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      - DB_HOST=35.226.64.52
      - DB_USER=IAC_2026_02_amabili_flor
      - DB_PASSWORD=OLv1YqcvRAjZws
      - DB_NAME=IAC_2026_02_amabili_flor
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - APP_URL=${APP_URL}
      - LOG_SERVICE_HOST=log-service
      - LOG_SERVICE_PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health?format=json', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Microsserviço Catálogo, Perfil de Usuário e Frontend (Atividades 2, 4, 5 e 6)
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    ports:
      - "8200:3000"
    networks:
      - app-network
    environment:
      - DB_HOST=35.226.64.52
      - DB_USER=IAC_2026_02_amabili_flor
      - DB_PASSWORD=OLv1YqcvRAjZws
      - DB_NAME=IAC_2026_02_amabili_flor
      - TMDB_API_KEY=${TMDB_API_KEY}
      - AUTH_SERVICE_URL=http://auth-service:3000
      - LOG_SERVICE_URL=http://log-service:3000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=perfil-fotos
      - APP_URL=${APP_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health?format=json', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      log-service:
        condition: service_healthy
      minio:
        condition: service_healthy